name: Tests

on:
  push:
    branches:
      - master
      - GithubTests
  pull_request:
    branches:
      - master
    
jobs:
  style_check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.x'
      - name: Check style
        run: dotnet format --verify-no-changes
      - name: Install reuse linter
        run: sudo apt-get install -y reuse
      - name: Check reuse compliance
        run: reuse lint

  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.x'
    - name: Test and generate coverage report
      run: dotnet test --collect:"XPlat Code Coverage" --settings coverlet.runsettings
    - name: Copy coveralls report
      run: |
        mkdir ./CoverageResults
        cp -v ./CompactObliviousTransfer.Tests/TestResults/*/coverage.info ./CoverageResults/
    - name: Publish coverage report to coveralls.io
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ./CoverageResults/coverage.info
